version: "3.3"
services:
  database:
    image: mysql:9.7
    container_name: mysql-db
    env_file:
      # - ./deshidratador-server/.env
      - ./.env
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - database:/var/lib/mysql

