version: '3.3'
services:
  database:
    image: mariadb:jammy
    container_name: mariadb-be-scesi
    env_file:
      # - ./deshidratador-server/.env
      - ./.env
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: holamundo
      MYSQL_DATABASE: deshidratador
      MYSQL_USER: deshidratador
      MYSQL_PASSWORD: holamundo
    ports:
      - "3306:3306"
    volumes:
      - maria_db:/var/lib/mysql

  node-app:
    build:
      context: ./deshidratador-server
      dockerfile: Dockerfile
    container_name: node-server
    restart: always
    env_file:
      # - ./deshidratador-server/.env
      - ./.env
    environment:
      - TZ=America/La_Paz
      - MYSQL_DATABASE=deshidratador
      - MYSQL_USER=deshidratador
      - MYSQL_PASSWORD=holamundo
      - DB_PASSWORD=holamundo
      - DB_HOST=database
      - DB_PORT=3306
    depends_on:
      - database
    ports:
      - "3000:3000"
    volumes:
      - ./deshidratador-server:/app
      # - /app/node_modules

  web-app:
    image: node:20-alpine
    container_name: web-app
    # restart: always
    env_file:
      # - ./Deshidratador-Front/.env
      - ./.env
    build:
      context: ./Deshidratador-Front
      dockerfile: Dockerfile
    environment:
      - TZ=America/La_Paz
    depends_on:
      - node-app
      - database
    ports:
      # - "${WEB_PORT}:80"
      # - "80:${WEB_PORT}"
      - "80:80"
    volumes:
      - ./Deshidratador-Front:/app
      - node_modules:/app/node_modules
      - .:/app

volumes:
  node_modules:
  maria_db: