# version: '3.8'
services:
  database:
    image: mariadb:jammy
    container_name: mariadb-be-scesi
    env_file:
      - ./deshidratador-server/.env
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # mypassword
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - maria_db:/var/lib/mysql

  node-app:
    build:
      context: ./deshidratador-server
      dockerfile: Dockerfile
    container_name: node-server
    restart: always
    env_file: 
      - ./deshidratador-server/.env
    environment:
      - TZ=America/La_Paz
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=database
      - DB_PORT=3306
    depends_on:
      - database
    ports:
      - "${NODE_PORT}:${NODE_PORT}"
    volumes:
      - ./deshidratador-server:/app
      - /app/node_modules
  
  web-app:
    image: node:20-alpine
    container_name: web-app
    # restart: always
    env_file:
      - ./Deshidratador-Front/.env
    build:
      context: ./Deshidratador-Front
      dockerfile: Dockerfile
    # env_file: ./Deshidratador-Front/.env
    environment:
      - TZ=America/La_Paz
    depends_on:
      - node-app
      - database
    ports:
      # - "${WEB_PORT}:80"
      - "${WEB_PORT}:${WEB_PORT}"
      - "80:80"
    volumes:
      - ./Deshidratador-Front:/app
      - node_modules:/app/node_modules
      - .:/app

volumes:
  node_modules:
  maria_db: 