# version: '3.8'
services:
  database:
    image: mariadb:linuxserver/mariadb:arm32v7-110.4.18mariabionic-ls12
    container_name: mariadb-be-scesi
    env_file:
      - ./deshidratador-server/.env
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # mypassword
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - maria_db:/var/lib/mysql

  node-app:
    restart: always
    build:
      context: ./deshidratador-server
      dockerfile: Dockerfile
    env_file: ./deshidratador-server/.env
    container_name: node-server
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    depends_on:
      - database
    ports:
      - "${NODE_PORT}:${NODE_PORT}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules 
  
